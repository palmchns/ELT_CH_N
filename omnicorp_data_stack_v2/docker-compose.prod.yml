name: omnicorp-production

x-runtime: &runtime
  image: ${ELT_IMAGE:-omnicorp-elt:local}
  build: .
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=512m
  secrets: [prefect_auth]
  logging: &bounded_logs
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  prefect:
    <<: *runtime
    command: [prefect, server, start, --host, 0.0.0.0]
    restart: unless-stopped
    environment:
      REQUIRE_API_AUTH: "true"
      PREFECT_HOME: /var/lib/prefect
      PREFECT_SERVER_DATABASE_CONNECTION_URL: sqlite+aiosqlite:////var/lib/prefect/prefect.db
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      PREFECT_SERVER_API_CSRF_PROTECTION_ENABLED: "true"
      PREFECT_UI_API_URL: ${PREFECT_UI_API_URL:-http://localhost:4206/api}
    volumes:
      - prefect_data:/var/lib/prefect
    ports:
      - "127.0.0.1:4206:4200"
    healthcheck:
      test: [CMD, python, /app/server_health.py]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 2g
    cpus: 2

  runner:
    <<: *runtime
    profiles: [jobs]
    command: [python, run_pipeline.py, run]
    restart: "no"
    depends_on:
      prefect:
        condition: service_healthy
      bi_init:
        condition: service_completed_successfully
    environment:
      REQUIRE_API_AUTH: "true"
      IN_DOCKER: "true"
      OBS_DIR: /app/obs_data
      PREFECT_HOME: /tmp/prefect
      PREFECT_API_URL: http://prefect:4200/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      MAX_FAILED_RULE_CHECKS: ${MAX_FAILED_RULE_CHECKS:-0}
      MAX_SOURCE_BYTES: ${MAX_SOURCE_BYTES:-268435456}
      CHINOOK_SHA256: ${CHINOOK_SHA256:-}
      NORTHWIND_SHA256: ${NORTHWIND_SHA256:-}
      SERVING_ENABLED: "true"
      BI_HOST: warehouse
    secrets: [prefect_auth, bi_writer]
    volumes:
      - lake_data:/app/obs_data
    mem_limit: 4g
    cpus: 2

  warehouse:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: warehouse_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/bi_postgres_admin
      POSTGRES_DB: postgres
    secrets: [bi_postgres_admin]
    volumes:
      - bi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U warehouse_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: [no-new-privileges:true]
    logging: *bounded_logs
    mem_limit: 1g
    cpus: 1

  bi_init:
    <<: *runtime
    command: [python, -m, utils.serving, init]
    restart: "no"
    depends_on:
      warehouse:
        condition: service_healthy
    environment:
      BI_HOST: warehouse
    secrets: [bi_postgres_admin, bi_writer, bi_reader, metabase_app]
    mem_limit: 256m

  metabase:
    image: ${METABASE_IMAGE:-metabase/metabase:v0.64.1}
    entrypoint: [/bin/sh, -ec]
    command:
      - 'test -s /run/secrets/metabase_encryption; test -s /run/secrets/metabase_session; export MB_ENCRYPTION_SECRET_KEY="$$(cat /run/secrets/metabase_encryption)"; export MB_SESSION_SECRET_KEY="$$(cat /run/secrets/metabase_session)"; exec /app/run_metabase.sh'
    restart: unless-stopped
    user: "2000:2000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *bounded_logs
    tmpfs:
      - /tmp:rw,nosuid,size=512m
    depends_on:
      bi_init:
        condition: service_completed_successfully
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: warehouse
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase_app
      MB_DB_PASS_FILE: /run/secrets/metabase_app
      MB_PLUGINS_DIR: /tmp/plugins
      MB_DISABLE_LEGACY_STARTUP_ENCRYPTION: "true"
      JAVA_OPTS: -Xms256m -Xmx1536m
    secrets: [metabase_app, metabase_encryption, metabase_session]
    ports:
      - "127.0.0.1:${METABASE_PORT:-3051}:3000"
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:3000/api/health]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    mem_limit: 2g
    cpus: 2

secrets:
  prefect_auth:
    file: ./.secrets/prefect_auth
  bi_postgres_admin:
    file: ./.secrets/bi_postgres_admin
  bi_writer:
    file: ./.secrets/bi_writer
  bi_reader:
    file: ./.secrets/bi_reader
  metabase_app:
    file: ./.secrets/metabase_app
  metabase_encryption:
    file: ./.secrets/metabase_encryption
  metabase_session:
    file: ./.secrets/metabase_session

volumes:
  prefect_data:
  lake_data:
  bi_postgres_data:
